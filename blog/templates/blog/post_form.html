{% extends 'blog/base.html' %} {% block content %}

<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
      <!-- HEADER -->
      <div class="bg-dark text-white p-4">
        <h2 class="fw-bold mb-0">Create / Update Post</h2>
      </div>

      <!-- FORM -->
      <div class="card-body p-5">
        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}

          <!-- TITLE -->
          <div class="mb-4">
            <label class="form-label fw-bold"> Post Title </label>

            {{ form.title }}
          </div>

          <!-- IMAGE -->

          <div class="mb-4">
            <label class="form-label fw-bold mb-3"> Featured Image </label>

            {% if form.instance.image %}

            <div class="current-image-container mb-3">
              <img
                src="{{ form.instance.image.url }}"
                class="current-post-image"
              />

              <div class="remove-image-check">
                {{ form.remove_image }}

                <label for="{{ form.remove_image.id_for_label }}">
                  Remove current image
                </label>
              </div>
            </div>

            {% endif %} {{ form.image }}
          </div>

          <!-- CONTENT -->
          <div class="mb-4">
            <label class="form-label fw-bold"> Blog Content </label>

            {{ form.content }}
          </div>

          <!-- BUTTONS -->
          <div class="d-flex justify-content-between align-items-center mt-5">
            <a
              href="{% url 'home' %}"
              class="btn btn-outline-dark rounded-pill px-4"
            >
              Cancel
            </a>

            <button type="submit" class="btn btn-dark rounded-pill px-5">
              Save Post
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<style>
  input,
  textarea {
    width: 100%;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid #ddd;
    transition: 0.25s ease;
    font-size: 15px;
  }

  textarea {
    height: 150px;
    resize: vertical;
  }

  input:focus,
  textarea:focus {
    border-color: #000;
    box-shadow: none;
    outline: none;
  }

  input[type="file"] {
    background: #f8f9fa;
    cursor: pointer;
  }

  .card {
    transition: 0.3s ease;
  }

  .card:hover {
    transform: translateY(-2px);
  }

  /* CURRENT IMAGE */

  .current-image-container {
    background: #fafafa;

    border: 1px solid #ececec;

    border-radius: 20px;

    padding: 16px;

    margin-bottom: 16px;
  }

  /* IMAGE PREVIEW */

  .current-post-image {
    width: 100%;

    max-height: 260px;

    object-fit: cover;

    border-radius: 16px;

    margin-bottom: 14px;
  }

  /* REMOVE CHECKBOX */

  .remove-image-check {
    display: flex;

    align-items: center;

    gap: 10px;

    font-size: 15px;

    color: #555;
  }

  /* CHECKBOX */

  .remove-image-check input[type="checkbox"] {
    width: 18px;

    height: 18px;

    cursor: pointer;
  }
</style>

{% endblock %}
