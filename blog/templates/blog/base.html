<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Website</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f5f7fb;
      }

      .card {
        transition: 0.3s ease;
      }

      .card:hover {
        transform: translateY(-3px);
      }

      a {
        text-decoration: none;
      }

      /* Overlay */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        opacity: 0;
        transition: 0.3s ease;
        z-index: 999;
      }

      .overlay.active {
        display: block;
        opacity: 1;
      }

      /* Edit Popup */
      .edit-panel {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.95);

        width: 100%;
        max-width: 500px;

        background: white;
        padding: 32px;
        border-radius: 28px;

        display: none;
        opacity: 0;

        transition: 0.25s ease;
        z-index: 1000;

        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.12),
          0 8px 20px rgba(0, 0, 0, 0.06);
      }

      .edit-panel.active {
        display: block;
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      /* Title */
      .edit-panel h4 {
        font-weight: 700;
        margin-bottom: 24px;
      }

      /* Labels */
      .edit-panel label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #111827;
        margin-bottom: 10px;
      }

      /* Inputs */
      .edit-panel input{
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        background: #fafafa;
        font-size: 15px;
        transition: 0.2s ease;
      }
      
      .edit-panel textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        background: #fafafa;
        font-size: 15px;
        transition: 0.2s ease;
      }

      .edit-panel textarea {
        height: 120px;
        resize: vertical;
      }

      /* Focus */
      .edit-panel input:focus,
      .edit-panel textarea:focus {
        border-color: #111;
        /* background: white; */
        outline: none;
        box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.04);
      }

      /* File Input */
      .edit-panel input[type="file"] {
        cursor: pointer;
      }

      /* Choose File Button */
      .edit-panel input[type="file"]::file-selector-button,
      .edit-panel input[type="file"]::-webkit-file-upload-button {
        border: none;
        padding: 10px 16px;
        border-radius: 12px;
        margin-right: 14px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.25s ease;
      }

      .edit-panel input[type="file"]::file-selector-button:hover,
      .edit-panel input[type="file"]::-webkit-file-upload-button:hover {
        background: #000;
      }

      /* Buttons */
      .edit-panel .btn {
        border-radius: 14px;
        padding: 10px 18px;
        transition: 0.2s ease;
      }

      .edit-panel .btn:hover {
        transform: translateY(-1px);
      }

      /* Comment box */
      .comment-box {
        border: 1px solid #e5e5e5;
        border-radius: 12px;
        padding: 12px;
        resize: none;
        font-size: 15px;
        transition: 0.2s ease;
      }

      .comment-box:focus {
        border-color: #000;
        box-shadow: none;
      }
    </style>
  </head>
  <script>
    function toggleEditProfile() {
      const panel = document.getElementById("editPanel");
      const overlay = document.getElementById("overlay");

      panel.classList.toggle("active");
      overlay.classList.toggle("active");
    }
  </script>

  <body class="bg-light" id="body">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container d-flex align-items-center justify-content-between">
        <!-- Brand -->
        <a class="navbar-brand fw-bold text-light" href="{% url 'home' %}">
          Django Blog
        </a>

        <!-- Buttons -->
        <div class="d-flex align-items-center gap-2">
          <button
            onclick="toggleDarkMode()"
            class="btn btn-outline-light btn-sm px-3"
          >
            🌙
          </button>

          {% if user.is_authenticated %}

          <a
            class="btn btn-outline-light btn-sm px-3"
            href="{% url 'create-post' %}"
          >
            Create
          </a>

          <a
            class="btn btn-outline-light btn-sm px-3"
            href="{% url 'profile' %}"
          >
            Profile
          </a>

          <form action="{% url 'logout' %}" method="POST" class="d-inline">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger btn-sm px-3">
              Logout
            </button>
          </form>

          {% else %}

          <a class="btn btn-outline-light btn-sm px-3" href="{% url 'login' %}">
            Login
          </a>

          <a class="btn btn-primary btn-sm px-3" href="{% url 'register' %}">
            Register
          </a>

          {% endif %}
        </div>
      </div>
    </nav>

    <div class="container mt-4">{% block content %} {% endblock %}</div>
    <script>
      function toggleDarkMode() {
        document.body.classList.toggle("bg-dark");
        document.body.classList.toggle("text-light");
      }
    </script>
  </body>
</html>
